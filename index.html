<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minimal SD.cpp Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: #333a4f;
      --input-bg: #232736;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      gap: 1.5rem;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .controls {
      width: 420px;
      min-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      overflow-y: auto;
      padding-right: 0.5rem;
    }
    .stage {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border-radius: 12px;
      border: 1px dashed var(--muted);
      overflow: hidden;
      position: relative;
    }
    .stage-bottom {
      display: flex;
      gap: 0.75rem;
      flex: 0 0 auto;
      min-height: 148px;
    }
    .browser-wrap {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem 0.75rem;
    }
    .preview-wrap {
      flex: 0 0 180px;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .preview-wrap img {
      display: block;
      width: 100%;
      height: 96px;
      object-fit: contain;
      border-radius: 6px;
      background: #11141c;
    }
    .preview-frame {
      position: relative;
      height: 96px;
      border-radius: 6px;
      background: #11141c;
      overflow: hidden;
    }
    .preview-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 96px;
      object-fit: contain;
      background: #0b0d14;
    }
    .preview-frame:not(.has-frame) img {
      visibility: hidden;
    }
    .browser-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    .browser {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 0.15rem;
    }
    .browser button {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 96px;
      min-width: 72px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #11141c;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
    .browser button.active {
      border-color: var(--accent);
    }
    .browser .thumb-label {
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0 0.4rem;
      white-space: nowrap;
    }
    .browser img {
      display: block;
      height: 96px;
      width: auto;
      border-radius: 6px;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .browser-empty {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0.4rem 0;
    }
    #i2iPanel {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem;
    }
    #i2iPanel[hidden] { display: none; }
    .i2i-dims {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .i2i-dims label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    #i2iPreview {
      display: block;
      background: #11141c;
      border-radius: 6px;
    }
    textarea, input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    input[type="number"] {
      width: 75px;
      text-align: right;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .row > .stepper { flex: 1; }
    .stepper input[type="number"] {
      flex: 1;
      width: 4.6rem;
      min-width: 4.2rem;
    }
    .slider-row .stepper { flex: 0 0 auto; }
    .stepper-btn {
      flex: 0 0 2.75rem;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      font-size: 1.55rem;
      line-height: 1;
      border-radius: 6px;
      background: #333a4f;
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .stepper-btn:hover { background: #3d4660; }
    input[type="range"] {
      flex: 1;
      padding: 0;
      accent-color: var(--accent);
    }
    textarea { height: 70px; resize: vertical; }
    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.25rem;
      display: block;
    }
    .field-group { display: flex; flex-direction: column; }
    .slider-row { display: flex; align-items: center; gap: 0.5rem; }
    .row { display: flex; gap: 0.5rem; }
    .nag-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem 0.75rem;
    }
    .nag-grid .field-group { min-width: 0; }
    .nag-grid .stepper { display: flex; width: 100%; }
    .nag-grid .stepper input[type="number"] {
      flex: 1;
      width: auto;
      min-width: 0;
    }

    details {
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    summary {
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
      user-select: none;
    }
    .details-body {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .gen-actions {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }
    .settings-save { width: 100%; }
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .settings-list button {
      width: 100%;
      text-align: left;
      white-space: normal;
    }
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 1rem;
    }
    .settings-overlay[hidden] { display: none; }
    .settings-dialog {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .settings-dialog .row { justify-content: flex-end; }
    .settings-dialog .btn-primary,
    .settings-dialog .btn-secondary {
      flex: 0 0 auto;
      width: auto;
    }
    button.btn-primary {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--accent-hover); }
    button.btn-cancel {
      flex: 0 0 96px;
      background: #4a2230;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      padding: 0.8rem 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button.btn-cancel:hover:not(:disabled) { background: #7f1d1d; }
    button.btn-secondary {
      background: #333a4f;
      color: var(--text);
      border: none;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .designer {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .designer.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    #scheduleChart {
      width: 100%;
      height: 160px;
      background: #11141c;
      border-radius: 6px;
    }
    .designer-controls {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .designer-controls label { text-transform: none; letter-spacing: 0; }
    .designer-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    .designer-hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .queue-item {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }
    .queue-item input {
      flex: 1;
      min-width: 0;
    }
    .queue-item .queue-x {
      flex: 0 0 auto;
      width: auto;
      padding: 0.4rem 0.55rem;
    }
    .queue-empty {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .client-log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      line-height: 1.35;
      color: #cbd5e1;
      background: #11141c;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.5rem;
      height: 9.5rem;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .gallery {
      position: absolute;
      inset: 0;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 1rem;
    }
    .gallery img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .status {
      position: absolute;
      bottom: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status.live {
      color: #fff;
      background: #2563eb;
      padding: 0.28rem 0.7rem;
      border-radius: 6px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="field-group">
      <label>Queue</label>
      <div id="queueList" class="queue-list"></div>
    </div>

    <div class="field-group">
      <label>Prompt</label>
      <textarea id="prompt" placeholder="A cozy cabin in the misty pine forest...">a cinematic shot of an ancient library, dust motes in sunbeams, hyperrealistic, octane render</textarea>
    </div>

    <div class="field-group">
      <label>Negative Prompt</label>
      <textarea id="negPrompt" style="height: 45px;">blurry, low quality, distorted, watermark</textarea>
    </div>

    <div class="field-group">
      <label title="Flux.2 dev attention guidance. CFG still uses Negative Prompt.">NAG Prompt</label>
      <textarea id="nagPrompt" style="height: 45px;" placeholder="Flux.2 dev only. Empty leaves NAG off."></textarea>
    </div>
    <div class="nag-grid">
      <div class="field-group">
        <label title="1 leaves NAG off. 5 is the usual on value.">NAG Scale</label>
        <input type="number" id="nagScale" min="1" max="20" step="0.5" value="1" />
      </div>
      <div class="field-group">
        <label>NAG Tau</label>
        <input type="number" id="nagTau" min="0" max="100" step="0.1" value="2.5" />
      </div>
      <div class="field-group">
        <label>NAG Alpha</label>
        <input type="number" id="nagAlpha" min="0" max="1" step="0.05" value="0.25" />
      </div>
      <div class="field-group">
        <label title="NAG applies while sigma is at least this value.">Sigma End</label>
        <input type="number" id="nagSigmaEnd" min="0" max="1000" step="0.05" value="0.75" />
      </div>
    </div>

    <!-- Seed & Randomizer -->
    <div class="field-group">
      <label>Seed (-1 for Random)</label>
      <div class="row">
        <input type="number" id="seed" value="-1" style="flex: 1;" />
        <button class="btn-secondary" title="Roll New Seed" onclick="rollSeed()">🎲 Roll</button>
        <button class="btn-secondary" title="Reset to Random" onclick="document.getElementById('seed').value = -1; persistSession()">🔄 -1</button>
      </div>
    </div>

    <!-- Steps -->
    <div class="field-group">
      <label>Sampling Steps</label>
      <div class="slider-row">
        <input type="range" id="steps" min="1" max="100" value="20" oninput="stepsNum.value = this.value; drawScheduleChart()" />
        <input type="number" id="stepsNum" min="1" max="100" value="20" oninput="steps.value = this.value; drawScheduleChart()" />
      </div>
    </div>

    <!-- CFG Scale -->
    <div class="field-group">
      <label>CFG Scale</label>
      <div class="slider-row">
        <input type="range" id="cfg" min="1" max="25" step="0.5" value="7.0" oninput="cfgNum.value = this.value" />
        <input type="number" id="cfgNum" min="1" max="25" step="0.5" value="7.0" oninput="cfg.value = this.value" />
      </div>
    </div>

    <!-- Resolution -->
    <div class="row">
      <div class="field-group" style="flex:1">
        <label>Width</label>
        <input type="number" id="width" min="64" max="2048" step="64" value="512" />
      </div>
      <div class="field-group" style="flex:1">
        <label>Height</label>
        <input type="number" id="height" min="64" max="2048" step="64" value="512" />
      </div>
      <div class="field-group" style="flex:1">
        <label>Preset</label>
        <select onchange="applyPreset(this.value)">
          <option value="512x512">512×512</option>
          <option value="768x768">768×768</option>
          <option value="1024x1024">1024×1024</option>
          <option value="512x768">512×768</option>
          <option value="768x512">768×512</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label>Mode</label>
      <select id="genMode" onchange="syncI2i()">
        <option value="t2i" selected>t2i</option>
        <option value="i2i">i2i</option>
      </select>
    </div>

    <div id="i2iPanel" hidden>
      <div class="row">
        <input type="file" id="i2iFile" accept="image/*" style="flex:1" />
        <button class="btn-secondary" type="button" onclick="useShownForI2i()">Use shown</button>
      </div>
      <div class="field-group">
        <label>Denoise strength</label>
        <div class="slider-row">
          <input type="range" id="i2iStrength" min="0" max="1" step="0.05" value="0.75" oninput="i2iStrengthNum.value = this.value" />
          <input type="number" id="i2iStrengthNum" min="0" max="1" step="0.05" value="0.75" oninput="i2iStrength.value = this.value" />
        </div>
      </div>
      <div class="field-group">
        <label>dim:</label>
        <div class="i2i-dims" onchange="updateI2iPreview()">
          <label><input type="radio" name="i2iDim" value="source" checked style="width:auto" /> source</label>
          <label><input type="radio" name="i2iDim" value="stretch" style="width:auto" /> stretch</label>
          <label><input type="radio" name="i2iDim" value="fill" style="width:auto" /> fill</label>
          <label><input type="radio" name="i2iDim" value="fit-white" style="width:auto" /> fit+white</label>
          <label><input type="radio" name="i2iDim" value="fit-black" style="width:auto" /> fit+black</label>
          <label><input type="radio" name="i2iDim" value="fit-grey" style="width:auto" /> fit+grey</label>
          <label><input type="radio" name="i2iDim" value="fit-tile" style="width:auto" /> fit+tile</label>
        </div>
      </div>
      <canvas id="i2iPreview" width="320" height="140"></canvas>
    </div>

    <!-- Sampler & Scheduler -->
    <div class="row">
      <div class="field-group" style="flex:1">
        <label>Sampler</label>
        <select id="sampler">
          <option value="euler" selected>Euler</option>
          <option value="euler_a">Euler a (crashes on this GPU)</option>
          <option value="dpm++2m">DPM++ 2M</option>
          <option value="dpm++2s_a">DPM++ 2S a</option>
          <option value="heun">Heun (crashes on this GPU)</option>
          <option value="lcm">LCM</option>
          <option value="ddim_trailing">DDIM</option>
        </select>
      </div>
      <div class="field-group" style="flex:1">
        <label>Schedule Type</label>
        <select id="scheduler" onchange="syncDesigner()">
          <option value="" selected>Default</option>
          <option value="__designer__">[Schedule Designer]</option>
          <option value="discrete">Discrete</option>
          <option value="karras">Karras</option>
          <option value="exponential">Exponential</option>
          <option value="ays">AYS</option>
          <option value="gits">GITS</option>
          <option value="sgm_uniform">SGM Uniform</option>
          <option value="simple">Simple</option>
          <option value="smoothstep">Smoothstep</option>
          <option value="kl_optimal">KL Optimal</option>
          <option value="lcm">LCM</option>
          <option value="bong_tangent">Bong tangent</option>
          <option value="tangent">Tangent</option>
          <option value="ltx2">LTX2</option>
          <option value="logit_normal">Logit-Normal</option>
          <option value="flux2">Flux2</option>
          <option value="flux">Flux</option>
          <option value="beta">Beta</option>
        </select>
      </div>
    </div>

    <!-- Generation & Clip Skip -->
    <div class="row">
      <div class="field-group" style="flex:1">
        <label>Batch Size</label>
        <input type="number" id="batchSize" min="1" max="8" value="1" />
      </div>
      <div class="field-group" style="flex:1">
        <label>Clip Skip</label>
        <input type="number" id="clipSkip" min="1" max="4" value="1" />
      </div>
    </div>

    <!-- Highres Fix Panel -->
    <details>
      <summary>Highres Fix (Upscale)</summary>
      <div class="details-body">
        <label style="display:flex; align-items:center; gap:0.5rem; text-transform:none; cursor:pointer;">
          <input type="checkbox" id="enableHr" style="width:auto;" /> Enable Highres Fix
        </label>
        <div class="row">
          <div class="field-group" style="flex:1">
            <label>Scale Multiplier</label>
            <input type="number" id="hrScale" min="1.0" max="4.0" step="0.25" value="2.0" />
          </div>
          <div class="field-group" style="flex:1">
            <label>HR Steps (0=match)</label>
            <input type="number" id="hrSteps" min="0" max="100" value="10" />
          </div>
        </div>
        <div class="field-group">
          <label>Denoising Strength</label>
          <div class="slider-row">
            <input type="range" id="hrDenoise" min="0" max="1" step="0.05" value="0.5" oninput="hrDenoiseNum.value = this.value" />
            <input type="number" id="hrDenoiseNum" min="0" max="1" step="0.05" value="0.5" oninput="hrDenoise.value = this.value" />
          </div>
        </div>
      </div>
    </details>

    <div class="field-group">
      <label>Saved settings</label>
      <div id="savedSettings" class="settings-list"></div>
      <button class="btn-secondary settings-save" type="button" onclick="openSaveSettings()">Save settings</button>
    </div>

    <div class="gen-actions">
      <button id="cancelBtn" class="btn-cancel" type="button" disabled onclick="cancelCurrent()">Cancel</button>
      <button id="genBtn" class="btn-primary" type="button" onclick="enqueueGenerate()">Generate Image</button>
    </div>

    <div id="designerPanel" class="designer disabled">
      <label>Schedule Designer</label>
      <select id="designerFormula" onchange="syncDesigner()">
        <option value="discrete">Discrete</option>
        <option value="karras">Karras</option>
        <option value="exponential">Exponential</option>
        <option value="ays">AYS</option>
        <option value="gits">GITS</option>
        <option value="sgm_uniform">SGM Uniform</option>
        <option value="simple" selected>Simple</option>
        <option value="smoothstep">Smoothstep</option>
        <option value="kl_optimal">KL Optimal</option>
        <option value="lcm">LCM</option>
        <option value="bong_tangent">Bong tangent</option>
        <option value="tangent">Tangent</option>
        <option value="ltx2">LTX2</option>
        <option value="logit_normal">Logit-Normal</option>
        <option value="flux2">Flux2</option>
        <option value="flux">Flux</option>
        <option value="beta">Beta</option>
      </select>
      <div id="designerControls" class="designer-controls"></div>
    </div>
    <canvas id="scheduleChart" width="360" height="160"></canvas>

    <div class="field-group">
      <label>Client log</label>
      <div id="clientLog" class="client-log"></div>
    </div>
  </div>

  <div class="stage">
    <div class="viewport">
      <div id="gallery" class="gallery"></div>
      <div id="status" class="status">Ready (Target: Port 1493, ComfyUI RNG)</div>
    </div>
    <div class="stage-bottom">
      <div class="browser-wrap">
        <div class="browser-label">Outputs</div>
        <div id="browser" class="browser"></div>
      </div>
      <div class="preview-wrap">
        <div class="browser-label">Preview</div>
        <div id="livePreviewFrame" class="preview-frame">
          <img id="livePreviewImg" alt="preview" decoding="async" />
        </div>
