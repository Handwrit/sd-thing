<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minimal SD.cpp Studio</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: #333a4f;
      --input-bg: #232736;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      gap: 1.5rem;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    .controls {
      width: 420px;
      min-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      overflow-y: auto;
      padding-right: 0.5rem;
    }
    .stage {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border-radius: 12px;
      border: 1px dashed var(--muted);
      overflow: hidden;
      position: relative;
    }
    .stage-bottom {
      display: flex;
      gap: 0.75rem;
      flex: 0 0 auto;
      min-height: 148px;
    }
    .browser-wrap {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem 0.75rem;
    }
    .preview-wrap {
      flex: 0 0 180px;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem 0.75rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .preview-wrap img {
      display: block;
      width: 100%;
      height: 96px;
      object-fit: contain;
      border-radius: 6px;
      background: #11141c;
    }
    .preview-frame {
      position: relative;
      height: 96px;
      border-radius: 6px;
      background: #11141c;
      overflow: hidden;
    }
    .preview-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 96px;
      object-fit: contain;
      background: #0b0d14;
    }
    .preview-frame:not(.has-frame) img {
      visibility: hidden;
    }
    .browser-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }
    .browser {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 0.15rem;
    }
    .browser .thumb-item {
      position: relative;
      flex: 0 0 auto;
      display: flex;
    }
    .browser .thumb-open {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 96px;
      min-width: 72px;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #11141c;
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }
    .browser .thumb-open.active {
      border-color: var(--accent);
    }
    .browser .thumb-delete {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      z-index: 1;
      width: auto;
      min-width: 0;
      padding: 0.05rem 0.35rem;
      line-height: 1.1;
      font-size: 0.75rem;
      border-radius: 4px;
    }
    .browser .thumb-label {
      font-size: 0.68rem;
      color: var(--muted);
      padding: 0 0.4rem;
      white-space: nowrap;
    }
    .browser img {
      display: block;
      height: 96px;
      width: auto;
      border-radius: 6px;
      object-fit: cover;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .browser-empty {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0.4rem 0;
    }
    #i2iPanel {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem;
    }
    #i2iPanel[hidden] { display: none; }
    .ref-pager {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .ref-pager[hidden] { display: none; }
    .ref-pager span { flex: 1; font-size: 0.85rem; }
    #qwenUseInitLabel[hidden], #refIncludeLabel[hidden] { display: none; }
    #sizeMp { text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 500; }
    .size-board { display: flex; flex-direction: column; gap: 0.45rem; }
    .size-head {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .size-head strong { color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; }
    .size-rotate {
      margin-left: auto;
      padding: 0.15rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .size-rotate[hidden] { display: none; }
    .size-rotate.is-on {
      border-color: #c4844a;
      background: #3a2a22;
      color: #f3d2b0;
    }
    .size-group { display: flex; flex-direction: column; gap: 0.3rem; }
    .size-group-title {
      margin: 0;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .size-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.35rem; }
    .size-chip {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.05rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 0.38rem 0.42rem;
      cursor: pointer;
      text-align: left;
      line-height: 1.15;
    }
    .size-chip:hover { border-color: #4f5670; }
    .size-chip.is-on { border-color: var(--accent); background: #2a2f4a; }
    .size-chip.is-rotated { border-color: #c4844a; background: #3a2a22; }
    .size-chip.is-rotated.is-on { border-color: var(--accent); background: #3a2a22; }
    .size-chip .ratio { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
    .size-chip .dims { font-size: 0.78rem; font-weight: 600; }
    .size-chip .mp { font-size: 0.66rem; color: var(--muted); }
    .i2i-dims {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .i2i-dims label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    #i2iPreview {
      display: block;
      background: #11141c;
      border-radius: 6px;
    }
    textarea, input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.85rem;
    }
    input[type="number"] {
      width: 75px;
      text-align: right;
      -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .row > .stepper { flex: 1; }
    .stepper input[type="number"] {
      flex: 1;
      width: 4.6rem;
      min-width: 4.2rem;
    }
    .slider-row .stepper { flex: 0 0 auto; }
    .stepper-btn {
      flex: 0 0 2.75rem;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      font-size: 1.55rem;
      line-height: 1;
      border-radius: 6px;
      background: #333a4f;
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .stepper-btn:hover { background: #3d4660; }
    input[type="range"] {
      flex: 1;
      padding: 0;
      accent-color: var(--accent);
    }
    textarea { height: 70px; resize: vertical; }
    label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.25rem;
      display: block;
    }
    .field-group { display: flex; flex-direction: column; }
    #i2iStrengthGroup[hidden], #i2iDimGroup[hidden], #videoFramesGroup[hidden] { display: none; }
    .slider-row { display: flex; align-items: center; gap: 0.5rem; }
    .row { display: flex; gap: 0.5rem; }
    .nag-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem 0.75rem;
    }
    .nag-grid .field-group { min-width: 0; }
    .nag-grid .stepper { display: flex; width: 100%; }
    .nag-grid .stepper input[type="number"] {
      flex: 1;
      width: auto;
      min-width: 0;
    }
    #nagArea {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .is-off {
      opacity: 0.42;
      filter: grayscale(1);
    }
    .is-off label,
    .is-off textarea,
    .is-off input,
    .is-off .stepper-btn {
      color: #8b93a7;
      cursor: not-allowed;
    }
    .is-off textarea,
    .is-off input[type="number"] {
      background: #171a22;
      border-color: #2a3142;
    }
    .is-off input[type="range"] {
      accent-color: #4b5563;
    }
    .is-off .stepper-btn,
    .is-off .stepper-btn:hover,
    .is-off button:disabled {
      background: #232733;
      color: #8b93a7;
      opacity: 1;
    }

    details {
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    summary {
      cursor: pointer;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      font-weight: 600;
      user-select: none;
    }
    .details-body {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .gen-top {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 0.28rem;
      background: var(--bg);
      padding-bottom: 0.15rem;
    }
    .gen-actions {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }
    .prompt-actions { margin-top: 0.4rem; }
    .prompt-actions button { flex: 1; }
    .settings-save { width: 100%; margin-top: 5px; }
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      flex: 0 0 auto;
      height: 26rem;
      overflow-y: scroll;
    }
    .settings-row {
      display: flex;
      gap: 0.35rem;
      align-items: stretch;
    }
    .settings-list button {
      width: 100%;
      text-align: left;
      white-space: normal;
    }
    .settings-row .settings-load {
      flex: 1;
      width: auto;
      min-width: 0;
    }
    .settings-row .settings-delete {
      flex: 0 0 auto;
      width: auto;
      padding: 0.4rem 0.7rem;
    }
    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 1rem;
    }
    .settings-overlay[hidden] { display: none; }
    .settings-dialog {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .settings-dialog .row { justify-content: flex-end; }
    .settings-dialog .btn-primary,
    .settings-dialog .btn-secondary {
      flex: 0 0 auto;
      width: auto;
    }
    button.btn-primary {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button.btn-primary:hover { background: var(--accent-hover); }
    button.btn-cancel {
      flex: 0 0 96px;
      background: #4a2230;
      color: #fecaca;
      border: 1px solid #7f1d1d;
      padding: 0.8rem 0.6rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button.btn-cancel:hover:not(:disabled) { background: #7f1d1d; }
    button.btn-secondary {
      background: #333a4f;
      color: var(--text);
      border: none;
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .designer {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .designer.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    #scheduleChart {
      width: 100%;
      height: 160px;
      background: #11141c;
      border-radius: 6px;
    }
    .designer-controls {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .designer-controls label { text-transform: none; letter-spacing: 0; }
    .designer-check {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: none;
      letter-spacing: 0;
      cursor: pointer;
    }
    .designer-hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .queue-item {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }
    .queue-item input {
      flex: 1;
      min-width: 0;
    }
    .queue-item .queue-x {
      flex: 0 0 auto;
      width: auto;
      padding: 0.4rem 0.55rem;
    }
    .queue-empty {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .client-log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      line-height: 1.35;
      color: #cbd5e1;
      background: #11141c;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.5rem;
      height: 9.5rem;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .gallery {
      position: absolute;
      inset: 0;
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 1rem;
    }
    .gallery img,
    .gallery video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }
    .status {
      font-size: 0.72rem;
      line-height: 1.3;
      color: var(--muted);
      min-height: 0.95rem;
    }
    .status.live {
      color: var(--text);
    }
  </style>
</head>
<body>

  <div class="controls">
    <div class="gen-top">
      <div id="status" class="status">Ready (Target: Port 1493, ComfyUI RNG)</div>
      <div class="gen-actions">
        <button id="cancelBtn" class="btn-cancel" type="button" disabled onclick="cancelCurrent()">Cancel</button>
        <button id="genBtn" class="btn-primary" type="button" onclick="enqueueGenerate()">Generate Image</button>
      </div>
    </div>

    <div class="field-group">
      <label>Queue</label>
      <div id="queueList" class="queue-list"></div>
    </div>

    <div class="field-group">
      <label>Prompt</label>
      <textarea id="prompt" placeholder="A cozy cabin in the misty pine forest...">a cinematic shot of an ancient library, dust motes in sunbeams, hyperrealistic, octane render</textarea>
      <div class="row prompt-actions">
        <button class="btn-secondary" type="button" id="loadPromptBtn">Load prompt</button>
        <button class="btn-secondary" type="button" id="loadPromptShownBtn">From shown</button>
        <input type="file" id="loadPromptFile" accept="image/png,.png" hidden />
      </div>
      <div class="row prompt-actions">
        <button class="btn-secondary" type="button" id="loadAllBtn">Load all</button>
        <button class="btn-secondary" type="button" id="loadAllShownBtn">Add all from shown</button>
        <input type="file" id="loadAllFile" accept="image/png,.png" hidden />
      </div>
    </div>

    <div class="field-group">
      <label>Negative Prompt</label>
      <textarea id="negPrompt" style="height: 45px;">blurry, low quality, distorted, watermark</textarea>
    </div>

    <div id="nagArea">
    <div class="field-group">
      <label title="Flux.2 dev attention guidance. CFG still uses Negative Prompt.">NAG Prompt</label>
      <textarea id="nagPrompt" style="height: 45px;" placeholder="Flux.2 dev only. Empty leaves NAG off."></textarea>
    </div>
    <div class="nag-grid">
      <div class="field-group">
        <label title="1 leaves NAG off. 5 is the usual on value.">NAG Scale</label>
        <input type="number" id="nagScale" min="1" max="20" step="0.5" value="1" />
      </div>
      <div class="field-group">
        <label>NAG Tau</label>
        <input type="number" id="nagTau" min="0" max="100" step="0.1" value="2.5" />
      </div>
      <div class="field-group">
        <label>NAG Alpha</label>
        <input type="number" id="nagAlpha" min="0" max="1" step="0.05" value="0.25" />
      </div>
      <div class="field-group">
        <label title="NAG applies while sigma is at least this value.">Sigma End</label>
        <input type="number" id="nagSigmaEnd" min="0" max="1000" step="0.05" value="0.75" />
      </div>
    </div>
    </div>

    <!-- Seed & Randomizer -->
    <div class="field-group">
      <label>Seed (-1 for Random)</label>
      <div class="row">
        <input type="number" id="seed" value="-1" style="flex: 1;" />
        <button class="btn-secondary" title="Roll New Seed" onclick="rollSeed()">🎲 Roll</button>
        <button class="btn-secondary" title="Reset to Random" onclick="document.getElementById('seed').value = -1; persistSession()">🔄 -1</button>
      </div>
    </div>

    <!-- Steps -->
    <div class="field-group">
      <label>Sampling Steps</label>
      <div class="slider-row">
        <input type="range" id="steps" min="1" max="100" value="20" oninput="stepsNum.value = this.value; drawScheduleChart()" />
        <input type="number" id="stepsNum" min="1" max="100" value="20" oninput="steps.value = this.value; drawScheduleChart()" />
      </div>
    </div>

    <!-- CFG Scale -->
    <div class="field-group">
      <label>CFG Scale</label>
      <div class="slider-row">
        <input type="range" id="cfg" min="1" max="25" step="0.5" value="7.0" oninput="cfgNum.value = this.value" />
        <input type="number" id="cfgNum" min="1" max="25" step="0.5" value="7.0" oninput="cfg.value = this.value" />
      </div>
    </div>

    <!-- Resolution -->
    <div class="row">
      <div class="field-group" style="flex:1">
        <label>Width</label>
        <input type="number" id="width" min="64" max="2816" step="64" value="512" />
      </div>
      <div class="field-group" style="flex:1">
        <label>Height</label>
        <input type="number" id="height" min="64" max="2816" step="64" value="512" />
      </div>
    </div>
    <div class="size-board" id="sizeBoard">
      <div class="size-head">Size <strong id="sizeProfile"></strong> <span id="sizeMp"></span><button type="button" id="sizeRotate" class="size-rotate" hidden>Rotate</button></div>
      <div id="sizeGroups"></div>
    </div>

    <div class="field-group">
      <label>Mode</label>
      <select id="genMode" onchange="syncI2i()">
        <option value="t2i" selected>t2i</option>
        <option value="i2i">i2i</option>
      </select>
    </div>

    <div class="field-group" id="videoFramesGroup" hidden>
      <label title="MiniMax-H3 frames. Count snaps to 17k+5, minimum 5. Playback is 24 fps.">Frames</label>
      <input type="number" id="videoFrames" min="5" step="17" value="5" disabled />
    </div>

    <div id="i2iPanel" hidden>
      <div id="refPager" class="ref-pager" hidden>
        <button class="btn-secondary" type="button" onclick="stepRefPage(-1)">←</button>
        <span id="refPageLabel">1 / 4 · Main</span>
        <button class="btn-secondary" type="button" onclick="stepRefPage(1)">→</button>
      </div>
      <div class="row">
        <input type="file" id="i2iFile" accept="image/*" style="flex:1" />
        <button class="btn-secondary" type="button" onclick="useShownForI2i()">Use shown</button>
      </div>
      <label id="qwenUseInitLabel" class="designer-check" hidden>
        <input type="checkbox" id="qwenUseInit" style="width:auto" /> Use this image as the init image
      </label>
      <label id="refIncludeLabel" class="designer-check" hidden>
        <input type="checkbox" id="refInclude" style="width:auto" /> Include
      </label>
      <div class="field-group" id="i2iStrengthGroup">
        <label>Denoise strength</label>
        <div class="slider-row">
          <input type="range" id="i2iStrength" min="0" max="1" step="0.05" value="0.75" oninput="i2iStrengthNum.value = this.value" />
          <input type="number" id="i2iStrengthNum" min="0" max="1" step="0.05" value="0.75" oninput="i2iStrength.value = this.value" />

  <script>
    const studioBase = 'http://127.0.0.1:3000';
    const apiBase = 'http://127.0.0.1:1493';
    const apiBaseReady = Promise.resolve();
    const DESIGNER_SENTINEL = '__designer__';
    const SIGMA_MIN = 0.03;
    const SIGMA_MAX = 14;
    let selectedOutput = null;
    let autoShowResult = true;
    let pendingJobs = [];
    let currentJob = null;
    let previewUrl = null;
    let previewWantKey = null;
    let previewShownKey = null;
    let previewInFlight = false;
    let liveSamplerStep = 0;
    let liveSamplerSteps = 0;
    let jobSchedule = null;
    let cancelArmedId = null;
    const scheduleQueue = [];
    const CLIENT_LOG_KEY = 'sd-doodad-client-log';
    const CLIENT_LOG_MAX = 160;
    const clientLogLines = [];

    function persistClientLog() {
      try {
        localStorage.setItem(CLIENT_LOG_KEY, JSON.stringify(clientLogLines));
      } catch (e) { /* quota / private mode */ }
    }

    function restoreClientLog() {
      try {
        const raw = localStorage.getItem(CLIENT_LOG_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return;
        parsed.forEach((line) => {
          if (typeof line === 'string') clientLogLines.push(line);
        });
        while (clientLogLines.length > CLIENT_LOG_MAX) clientLogLines.shift();
      } catch (e) { /* ignore bad cache */ }
    }

    const SESSION_KEY = 'sd-doodad-session';

    function readFormState() {
      const value = (id) => document.getElementById(id).value;
      return {
        prompt: value('prompt'),
        negPrompt: value('negPrompt'),
        nagPrompt: value('nagPrompt'),
        nagScale: value('nagScale'),
        nagTau: value('nagTau'),
        nagAlpha: value('nagAlpha'),
        nagSigmaEnd: value('nagSigmaEnd'),
        seed: value('seed'),
        steps: value('stepsNum'),
        cfg: value('cfgNum'),
        width: value('width'),
        height: value('height'),
        sampler: value('sampler'),
        scheduler: value('scheduler'),
        batchSize: value('batchSize'),
        clipSkip: value('clipSkip'),
        enableHr: document.getElementById('enableHr').checked,
        hrScale: value('hrScale'),
        hrSteps: value('hrSteps'),
        hrDenoise: value('hrDenoiseNum'),
        designerFormula: value('designerFormula'),
        genMode: value('genMode'),
        i2iStrength: value('i2iStrengthNum'),
        i2iDim: (document.querySelector('input[name="i2iDim"]:checked') || {}).value || 'source',
        videoFrames: value('videoFrames'),
        qwenUseInit: document.getElementById('qwenUseInit').checked,
        ref3On: ref3On,
        ref4On: ref4On,
      };
    }

    function applyFormState(form) {
      if (!form || typeof form !== 'object') return;
      const set = (id, val) => {
        if (val == null) return;
        const el = document.getElementById(id);
        if (el) el.value = val;
      };
      set('prompt', form.prompt);
      set('negPrompt', form.negPrompt);
      set('nagPrompt', form.nagPrompt);
      set('nagScale', form.nagScale);
      set('nagTau', form.nagTau);
      set('nagAlpha', form.nagAlpha);
      set('nagSigmaEnd', form.nagSigmaEnd);
      set('seed', form.seed);
      set('steps', form.steps);
      set('stepsNum', form.steps);
      set('cfg', form.cfg);
      set('cfgNum', form.cfg);
      set('width', form.width);
      set('height', form.height);
      set('sampler', form.sampler);
      set('scheduler', form.scheduler);
      set('batchSize', form.batchSize);
      set('clipSkip', form.clipSkip);
      set('hrScale', form.hrScale);
      set('hrSteps', form.hrSteps);
      set('hrDenoise', form.hrDenoise);
      set('hrDenoiseNum', form.hrDenoise);
      set('designerFormula', form.designerFormula);
      set('genMode', form.genMode);
      set('i2iStrength', form.i2iStrength);
      set('i2iStrengthNum', form.i2iStrength);
      set('videoFrames', form.videoFrames);
      if (form.i2iDim) {
        const dim = document.querySelector('input[name="i2iDim"][value="' + form.i2iDim + '"]');
        if (dim) dim.checked = true;
      }
      if (typeof form.enableHr === 'boolean') {
        document.getElementById('enableHr').checked = form.enableHr;
      }
      if (typeof form.qwenUseInit === 'boolean') {
        document.getElementById('qwenUseInit').checked = form.qwenUseInit;
      }
      if (typeof form.ref3On === 'boolean') ref3On = form.ref3On;
      if (typeof form.ref4On === 'boolean') ref4On = form.ref4On;
      syncRefChrome();
      syncSizeReadout();
    }

    let savedDesigner = {};

    function collectDesignerState() {
      const kind = document.getElementById('designerFormula').value;
      document.querySelectorAll('#designerControls [data-key]').forEach(el => {
        savedDesigner[kind + '.' + el.dataset.key] = el.type === 'checkbox' ? el.checked : el.value;
      });
      return savedDesigner;
    }

    function persistSession() {
      try {
        collectDesignerState();
        localStorage.setItem(SESSION_KEY, JSON.stringify({
          form: readFormState(),
          designer: savedDesigner,
        }));
      } catch (e) { /* quota / private mode */ }
    }

    function restoreSession() {
      let data = null;
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (raw) data = JSON.parse(raw);
      } catch (e) { /* ignore bad cache */ }
      if (!data || typeof data !== 'object') return;
      if (data.designer && typeof data.designer === 'object') savedDesigner = data.designer;
      applyFormState(data.form);
    }

    function openSaveSettings() {
      const overlay = document.getElementById('saveSettingsOverlay');
      overlay.hidden = false;
      const input = document.getElementById('saveSettingsNote');
      input.focus();
      input.select();
    }

    function cancelSaveSettings() {
      document.getElementById('saveSettingsOverlay').hidden = true;
    }

    async function confirmSaveSettings() {
      const note = document.getElementById('saveSettingsNote').value.trim();
      if (!note) return;
      collectDesignerState();
      const form = readFormState();
      delete form.seed;
      try {
        const res = await fetch(studioBase + '/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            note,
            model: connectedModel || 'model',
            i2i: isI2i(),
            form,
            designer: savedDesigner,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        document.getElementById('saveSettingsNote').value = '';
        cancelSaveSettings();
        dlog('saved settings ' + (data.name || note));
        await refreshSavedSettings();
      } catch (err) {
        setStatusText('Could not save settings: ' + (err && err.message ? err.message : err), false);
      }
    }

    async function refreshSavedSettings() {
      const host = document.getElementById('savedSettings');
      if (!host) return;
      let settings = [];
      try {
        const res = await fetch(studioBase + '/settings', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        settings = Array.isArray(data.settings) ? data.settings : [];
      } catch (err) {
        host.innerHTML = '';
        const empty = document.createElement('div');
        empty.className = 'browser-empty';
        empty.textContent = 'Settings server unavailable';
        host.appendChild(empty);
        return;
      }
      host.innerHTML = '';
      if (!settings.length) {
        const empty = document.createElement('div');
        empty.className = 'browser-empty';
        empty.textContent = 'None saved';
        host.appendChild(empty);
        return;
      }
      settings.forEach(item => {
        const name = item && item.name;
        if (!name) return;
        const row = document.createElement('div');
        row.className = 'settings-row';
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn-secondary settings-load';
        button.textContent = name;
        button.title = 'Load ' + name;
        button.addEventListener('click', () => { void loadSavedSetting(name); });
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'btn-secondary settings-delete';
        remove.textContent = 'x';
        remove.title = 'Delete ' + name;
        remove.addEventListener('click', () => { void deleteSavedSetting(name); });
        row.append(button, remove);
        host.appendChild(row);
      });
    }

    async function deleteSavedSetting(name) {
      if (!window.confirm('delete ' + name + ' y/n?')) return;
      try {
        const res = await fetch(studioBase + '/settings/' + encodeURIComponent(name), { method: 'DELETE' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        dlog('deleted settings ' + name);
        await refreshSavedSettings();
      } catch (err) {
        setStatusText('Could not delete settings: ' + (err && err.message ? err.message : err), false);
      }
    }

    async function loadSavedSetting(name) {
      try {
        const res = await fetch(studioBase + '/settings/' + encodeURIComponent(name), { cache: 'no-store' });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        if (data.designer && typeof data.designer === 'object') savedDesigner = data.designer;
        if (data.form) delete data.form.seed;
        applyFormState(data.form);
        const savedMode = data.form && data.form.genMode;
        const presetI2iWithoutImage = savedMode === 'i2i' && !i2iImageLoaded();
        if (presetI2iWithoutImage) {
          document.getElementById('genMode').value = 't2i';
        }
        syncDesigner();
        syncConnectedModel();
        syncI2i();
        snapH3Inputs();
        dlog('loaded settings ' + name);
        if (presetI2iWithoutImage) {
          setStatusText('Loaded ' + name + ' (saved as i2i; no init image stored)', false);
        }
      } catch (err) {
        setStatusText('Could not load settings: ' + (err && err.message ? err.message : err), false);
      }
    }

    async function pingServer() {
      try {
        const res = await fetch(apiBase + '/sdapi/v1/options', { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const model = data.sd_model_checkpoint || 'ok';
        connectedModel = model === 'ok' ? '' : model;
        dlog('sd-server connected ' + model);
        syncConnectedModel();
        drawScheduleChart();
        return model;
      } catch (e) {
        return null;
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function softwareCtx(canvas) {
      return canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    }

    function dlog(msg) {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const line = hh + ':' + mm + ':' + ss + ' ' + msg;
      clientLogLines.push(line);
      if (clientLogLines.length > CLIENT_LOG_MAX) clientLogLines.shift();
      persistClientLog();
      const el = document.getElementById('clientLog');
      if (el) {
        el.textContent = clientLogLines.join('\n');
        el.scrollTop = el.scrollHeight;
      }
      console.log('[doodad]', msg);
    }

    function setStatusText(text, live) {
      const status = document.getElementById('status');
      status.innerText = text;
      status.classList.toggle('live', !!live);
    }

    function rememberQueuedSchedule(payload) {
      const requested = Math.max(1, Number(payload.steps) || 1);
      const strength = Number(payload.denoising_strength);
      scheduleQueue.push({
        requested,
        skipped: payload.i2i ? skippedDenoiseSteps(requested, Number.isFinite(strength) ? strength : 1) : 0,
      });
    }

    function takeJobSchedule() {
      if (scheduleQueue.length) {
        jobSchedule = scheduleQueue.shift();
        return;
      }
      const requested = Math.max(1, Number(document.getElementById('stepsNum').value) || 1);
      const strength = Number(document.getElementById('i2iStrengthNum').value);
      jobSchedule = {
        requested,
        skipped: isI2i() ? skippedDenoiseSteps(requested, strength) : 0,
      };
    }

    // Heun and other two-pass samplers report the first evaluation as a negative
    // step. That pass is not a completed sample step. The last step stays negative
    // when the schedule ends at sigma 0, and that one does count.
    function completedSampleStep(step, steps) {
      const n = Number(step);
      const total = Number(steps);
      if (!Number.isFinite(n) || !Number.isFinite(total) || total <= 0) return 0;
      if (n > 0 && n <= total) return n;
      if (n < 0 && Math.abs(n) === total) return total;
      return 0;
    }

    function scheduleLabel(step, steps) {
      const n = completedSampleStep(step, steps);
      const total = Number(steps);
      if (!n || !Number.isFinite(total) || total <= 0) return 'starting';
      return 'step ' + n + ' of ' + total;
    }

    function setLivePreviewStatus(text, keepFrame) {
      const frame = document.getElementById('livePreviewFrame');
      if (!keepFrame) {
        frame.classList.remove('has-frame');
        const img = document.getElementById('livePreviewImg');
        img.removeAttribute('src');
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        previewWantKey = null;
        previewShownKey = null;
        liveSamplerStep = 0;
        liveSamplerSteps = 0;
      }
    }

    function loadPreviewImage(img, url) {
      return new Promise((resolve, reject) => {
        img.onload = () => resolve();
        img.onerror = () => reject(new Error('preview image failed'));
        img.src = url;
      });
    }

    async function pullPreview() {
      if (previewInFlight || document.hidden) return;
      const key = previewWantKey;
      if (!key || key === previewShownKey) return;
      previewInFlight = true;
      try {
        const res = await fetch(apiBase + '/preview.png?t=' + encodeURIComponent(key), { cache: 'no-store' });
        if (!res.ok || res.status === 204) return;
        const gotStep = res.headers.get('X-SD-Step');
        const gotSteps = res.headers.get('X-SD-Steps');
        const blob = await res.blob();
        if (!blob || blob.size < 32) return;
        const url = URL.createObjectURL(blob);
        const img = document.getElementById('livePreviewImg');
        const frame = document.getElementById('livePreviewFrame');
        try {
          await loadPreviewImage(img, url);
        } catch (e) {
          URL.revokeObjectURL(url);
          if (previewUrl) img.src = previewUrl;
          throw e;
        }
        frame.classList.add('has-frame');
        const previous = previewUrl;
        previewUrl = url;
        if (previous) URL.revokeObjectURL(previous);
        previewShownKey = (gotStep != null && gotSteps != null) ? (gotStep + '/' + gotSteps) : key;
      } catch (e) {
        dlog('preview fetch failed: ' + (e && e.message ? e.message : e));
      } finally {
        previewInFlight = false;
      }
    }

    function showLivePreview(step, steps, hasPreview) {
      const done = completedSampleStep(step, steps);
      if (done) {
        liveSamplerStep = done;
        liveSamplerSteps = Number(steps);
        if (currentJob && !currentJob.i2i) {
          jobSchedule = { requested: liveSamplerSteps, skipped: 0 };
        }
        setStatusText(scheduleLabel(liveSamplerStep, liveSamplerSteps), true);
        drawScheduleChart();
      } else if (!(liveSamplerStep > 0)) {
        setStatusText('starting', true);
      }
      if (!hasPreview) return;
      const key = String(step) + '/' + String(steps);
      previewWantKey = key;
      if (key !== previewShownKey) void pullPreview();
    }

    function rollSeed() {
      document.getElementById('seed').value = Math.floor(Math.random() * 2147483647);
      persistSession();
    }

    function megapixels(w, h) {
      const mp = (Number(w) * Number(h)) / 1000000;
      if (!Number.isFinite(mp) || mp <= 0) return '';
      return mp.toFixed(2) + ' MP';
    }

    let sizeRotated = false;

    function aspectLabel(w, h) {
      const named = [
        [1, 1], [5, 4], [4, 3], [3, 2], [16, 9], [2, 1], [21, 9],
        [4, 5], [3, 4], [2, 3], [9, 16], [1, 2], [9, 21],
      ];
      const ratio = w / h;
      let best = null;
      let err = 0.08;
      named.forEach(([a, b]) => {
        const delta = Math.abs(ratio - a / b);
        if (delta < err) {
          err = delta;
          best = a + ':' + b;
        }
      });
      if (best) return best;
      const gcd = (a, b) => b ? gcd(b, a % b) : a;
      const div = gcd(w, h) || 1;
      return (w / div) + ':' + (h / div);
    }

    function isFlux2Dev() {
      const name = connectedModel.toLowerCase();
      return (name.includes('flux2') || name.includes('flux.2') || name.includes('flux-2') || name.includes('f2dev'))
        && name.includes('dev');

    function isSd14() {

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function fluxTimeShift(mu, t) {
      if (t <= 0) return 0;
      return Math.exp(mu) / (Math.exp(mu) + Math.pow(1 / t - 1, 1));
    }

    function bongTangentSeg(steps, slope, pivot, start, end) {
      const sigmas = [];
      if (steps <= 0) return sigmas;
      const smax = ((2 / Math.PI) * Math.atan(-slope * (0 - pivot)) + 1) * 0.5;
      const smin = ((2 / Math.PI) * Math.atan(-slope * ((steps - 1) - pivot)) + 1) * 0.5;
      const srange = smax - smin;
      const sscale = start - end;
      if (Math.abs(srange) < 1e-8) {
        for (let i = 0; i < steps; i++) {
          const t = steps === 1 ? 0 : i / (steps - 1);
          sigmas.push(start + (end - start) * t);
        }
        return sigmas;
      }
      for (let x = 0; x < steps; x++) {
        const v = ((2 / Math.PI) * Math.atan(-slope * (x - pivot)) + 1) * 0.5;
        sigmas.push(((v - smin) / srange) * sscale + end);
      }
      return sigmas;
    }

    function designerNumber(key, fallback) {
      if (!designerEnabled()) return fallback;
      const kind = document.getElementById('designerFormula').value;
      const el = document.querySelector('#designerControls [data-key="' + key + '"]');
      if (!el || el.type === 'checkbox') {
        const n = Number(savedDesigner[kind + '.' + key]);
        return Number.isFinite(n) ? n : fallback;
      }
      const n = Number(el.value);
      return Number.isFinite(n) ? n : fallback;
    }

    function designerBool(key, fallback) {
      if (!designerEnabled()) return fallback;
      const kind = document.getElementById('designerFormula').value;
      const el = document.querySelector('#designerControls [data-key="' + key + '"]');
      if (!el) {
        const saved = savedDesigner[kind + '.' + key];
        return saved == null ? fallback : !!saved;
      }
      return !!el.checked;
    }

    function imageSeqLen() {
      let w = Number(document.getElementById('width').value) || 512;
      let h = Number(document.getElementById('height').value) || 512;
      if (isI2i() && i2iDim() === 'source' && i2iSource && i2iSource.naturalWidth) {
        w = round64(i2iSource.naturalWidth);
        h = round64(i2iSource.naturalHeight);
      }
      return Math.max(1, Math.round((w / 16) * (h / 16)));
    }

    function sigmoid(x) {
      return 1 / (1 + Math.exp(-x));
    }

    function normsinv(p) {
      const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00];
      const b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01, 1];
      const c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00];
      const d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00, 1];
      const plow = 0.02425;
      const phigh = 1 - plow;
      if (p <= 0) return -8;
      if (p >= 1) return 8;
      let q;
      if (p < plow) {
        q = Math.sqrt(-2 * Math.log(p));
        return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
          ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
      }
      if (p > phigh) {
        q = Math.sqrt(-2 * Math.log(1 - p));
        return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) /
          ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
      }
      q = p - 0.5;
      const r = q * q;
      return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q /
        (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1);
    }

    const AYS_SD15 = [14.6146412293, 6.4745760956, 3.8636745985, 2.6946151520, 1.8841921177, 1.3943805092, 0.9642583904, 0.6523686016, 0.3977456272, 0.1515232662, 0.0291671582];

    function resampleLog(levels, n) {
      if (n <= 1) return [levels[0]];
      const src = levels.map(v => Math.log(Math.max(v, 1e-8)));
      const out = [];
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1) * (src.length - 1);
        const j = Math.min(src.length - 2, Math.floor(t));
        const f = t - j;
        out.push(Math.exp(src[j] * (1 - f) + src[j + 1] * f));
      }
      return out;
    }

    function previewSigmas(kind, n) {
      const steps = Math.max(1, n | 0);
      const out = [];
      const tToSigma = (t) => lerp(SIGMA_MAX, SIGMA_MIN, 1 - (t / 999));
      const seq = imageSeqLen();
      if (kind === 'karras') {
        const rho = 7;
        const smin = Math.max(SIGMA_MIN, 1e-6);
        const minInv = Math.pow(smin, 1 / rho);
        const maxInv = Math.pow(SIGMA_MAX, 1 / rho);
        for (let i = 0; i < steps; i++) {
          const u = steps === 1 ? 0 : i / (steps - 1);
          out.push(Math.pow(maxInv + u * (minInv - maxInv), rho));
        }
      } else if (kind === 'exponential') {
        const logMin = Math.log(Math.max(SIGMA_MIN, 1e-6));
        const logMax = Math.log(SIGMA_MAX);
        const step = steps === 1 ? 0 : (logMax - logMin) / (steps - 1);
        for (let i = 0; i < steps; i++) out.push(Math.exp(logMax - step * i));
      } else if (kind === 'ays') {
        out.push(...resampleLog(AYS_SD15, steps));
      } else if (kind === 'gits') {
        for (let i = 0; i < steps; i++) {
          const u = steps === 1 ? 0 : i / (steps - 1);
          out.push(SIGMA_MAX * Math.pow(Math.max(SIGMA_MIN, 1e-6) / SIGMA_MAX, Math.pow(u, 1.2)));
        }
      } else if (kind === 'bong_tangent') {
        const start = SIGMA_MAX;
        const end = SIGMA_MIN;
        const middle = SIGMA_MIN + (SIGMA_MAX - SIGMA_MIN) * 0.5;
        const total = steps + 2;
        const pivot = Math.floor(total * 0.6);
        const slope = 0.2 / (total / 40);
        const midpoint = Math.floor(total * 0.6);
        const stage2 = total - midpoint;
        const stage1 = total - stage2;
        const s1 = bongTangentSeg(stage1, slope, pivot, start, middle);
        const s2 = bongTangentSeg(stage2, slope, pivot - stage1, middle, end);
        if (s1.length) s1.pop();
        out.push(...s1, ...s2);
        while (out.length < steps) out.push(end);
        if (out.length > steps) out.length = steps;
      } else if (kind === 'tangent') {
        const expanded = steps + 2;
        let mid = Math.round(designerNumber('midpoint', 0.5) * steps);
        mid = Math.min(expanded - 1, Math.max(1, mid));
        const stage1 = mid;
        const stage2 = expanded - mid;
        const p1 = designerNumber('pivot_1', 0.25) * steps;
        const p2 = designerNumber('pivot_2', 0.75) * steps;
        const start = designerNumber('start', 1);
        const middle = designerNumber('middle', 0.5);
        const end = designerNumber('end', 0);
        const s1 = bongTangentSeg(stage1, designerNumber('slope_1', 1), p1, start, middle);
        const s2 = bongTangentSeg(stage2, designerNumber('slope_2', 1), p2 - stage1, middle, end);
        if (s1.length) s1.pop();
        out.push(...s1, ...s2);
      } else if (kind === 'flux' || kind === 'flux2' || kind === 'ltx2') {
        let mu;
        if (kind === 'flux') {
          const base = designerNumber('base_shift', 0.5);
          const max = designerNumber('max_shift', 1.15);
          const m = (max - base) / (4096 - 256);
          mu = seq * m + (base - m * 256);
        } else if (kind === 'ltx2') {
          const base = designerNumber('base_shift', 0.95);
          const max = designerNumber('max_shift', 2.05);
          const m = (max - base) / (4096 - 1024);
          mu = seq * m + (base - m * 1024);
        } else {
          const m200 = 0.00016927 * seq + 0.45666666;
          const m10 = 8.73809524e-05 * seq + 1.89833333;
          const a = (m200 - m10) / 190;
          mu = seq > 4300 ? m200 : a * steps + (m200 - 200 * a);
        }
        for (let i = 0; i < steps; i++) {
          const t = 1 - i / steps;
          out.push(t <= 0 ? 0 : fluxTimeShift(mu, t));
        }
        if (kind === 'ltx2' && designerBool('stretch', true) && out.length > 1) {
          const terminal = Math.min(0.99, Math.max(0, designerNumber('terminal', 0.1)));
          const last = out[out.length - 1];
          const scale = (1 - last) / (1 - terminal);
          if (scale > 1e-8) {
            for (let i = 0; i < out.length; i++) out[i] = 1 - (1 - out[i]) / scale;
          }
        }
      } else if (kind === 'kl_optimal') {
        const aMin = Math.atan(Math.max(SIGMA_MIN, 1e-6));
        const aMax = Math.atan(SIGMA_MAX);
        for (let i = 0; i < steps; i++) {
          const u = steps === 1 ? 0 : i / (steps - 1);
          out.push(Math.tan(u * aMin + (1 - u) * aMax));
        }
      } else if (kind === 'smoothstep') {
        for (let i = 0; i < steps; i++) {
          let u = 1 - i / steps;
          u = u * u * (3 - 2 * u);
          out.push(tToSigma(Math.round(u * 999)));
        }
      } else if (kind === 'beta') {
        const alpha = Math.max(0.05, designerNumber('alpha', 0.6));
        const beta = Math.max(0.05, designerNumber('beta', 0.6));
        for (let i = 0; i < steps; i++) {
          const u = 1 - i / steps;
          const warped = Math.pow(u, beta / alpha) / (Math.pow(u, beta / alpha) + Math.pow(Math.max(1 - u, 1e-6), alpha / beta));
          out.push(tToSigma(Math.round(Math.min(1, Math.max(0, warped)) * 999)));
        }
      } else if (kind === 'logit_normal') {
        let mu = designerNumber('mu', 0);
        const std = Math.max(0.05, designerNumber('std', 1.75));
        if (designerBool('resolution_aware', true)) mu += 0.5 * Math.log(seq / ((512 * 512) / (16 * 16)));
        const tHi = sigmoid(0.5 * designerNumber('logsnr_max', 18));
        const tLo = sigmoid(0.5 * designerNumber('logsnr_min', -15));
        for (let i = 0; i < steps; i++) {
          const t = steps === 1 ? 0.5 : i / steps;
          let y = sigmoid(mu + std * (-normsinv(Math.min(0.999, Math.max(0.001, t)))));
          y = Math.min(tHi, Math.max(tLo, y));
          out.push(y);
        }
      } else if (kind === 'lcm') {
        const original = 50;
        const k = 1000 / original;
        for (let i = 0; i < steps; i++) {
          const index = Math.floor((i * original) / steps);
          const timestep = (original - index) * k - 1;
          out.push(tToSigma(timestep));
        }
      } else if (kind === 'simple' || kind === 'sgm_uniform' || kind === 'discrete') {
        for (let i = 0; i < steps; i++) {
          const u = steps === 1 ? 0 : i / (kind === 'discrete' ? (steps - 1) : steps);
          out.push(tToSigma(Math.round((1 - u) * 999)));
        }
      } else {
        for (let i = 0; i < steps; i++) {
          const u = steps === 1 ? 0 : i / (steps - 1);
          out.push(lerp(SIGMA_MAX, SIGMA_MIN, u));
        }
      }
      return out;
    }

    function syncRefDims() {
      const radios = document.querySelectorAll('input[name="i2iDim"]');
      if (isRef2va()) {
        if (dimBeforeRef == null) dimBeforeRef = i2iDim();
        const fit = document.querySelector('input[name="i2iDim"][value="fit-white"]');
        if (fit) fit.checked = true;
        radios.forEach(radio => { radio.disabled = true; });
      } else if (dimBeforeRef != null) {
        radios.forEach(radio => { radio.disabled = false; });
        const prev = document.querySelector('input[name="i2iDim"][value="' + dimBeforeRef + '"]');
        if (prev) prev.checked = true;
        dimBeforeRef = null;

      const dimGroup = document.getElementById('i2iDimGroup');
      if (dimGroup) dimGroup.classList.toggle('is-off', isRef2va());

    function alignVideoFrames(n) {
      let frames = Math.round(Number(n));
      if (!Number.isFinite(frames)) frames = 5;
      frames = Math.max(5, frames);
      while (frames % 17 !== 5) frames += 1;
      return frames;
    }

    function align32(n) {
      let value = Math.round(Number(n));
      if (!Number.isFinite(value)) value = 32;
      value = Math.max(32, value);
      const rem = value % 32;
      if (rem !== 0) value += 32 - rem;
      return value;
    }

    function snapH3Inputs() {
      if (!isH3()) return;
      const frames = document.getElementById('videoFrames');
      if (frames) {
        const aligned = alignVideoFrames(frames.value);
        if (String(aligned) !== frames.value) frames.value = String(aligned);
      }
      ['width', 'height'].forEach(id => {
        const el = document.getElementById(id);
        const aligned = align32(el.value);
        if (String(aligned) !== el.value) el.value = String(aligned);

    function defaultScheduleKind() {
      const sampler = document.getElementById('sampler').value;
      if (sampler === 'lcm') return 'lcm';
      if (sampler === 'ddim_trailing') return 'simple';
      const name = connectedModel.toLowerCase();
      if (name.includes('flux2') || name.includes('flux.2') || name.includes('flux-2')) return 'flux2';
      if (name.includes('flux')) return 'flux';
      if (name.includes('ltx')) return 'ltx2';
      return 'discrete';
    }

    function activeScheduleKind() {
      const selected = document.getElementById('scheduler').value;
      if (selected === DESIGNER_SENTINEL) {
        return document.getElementById('designerFormula').value || 'simple';
      }
      if (selected) return selected;
      return defaultScheduleKind();
    }

    function skippedDenoiseSteps(steps, strength) {
      if (!(strength < 1)) return 0;
      let tEnc = Math.floor(steps * strength);
      if (tEnc === steps) tEnc--;
      if (tEnc < 0) tEnc = 0;
      return Math.max(0, Math.min(steps, steps - tEnc - 1));
    }

    function drawScheduleChart() {
      const canvas = document.getElementById('scheduleChart');
      if (!canvas) return;
      const cssW = Math.max(1, Math.round(canvas.clientWidth || 360));
      const cssH = Math.max(1, Math.round(canvas.clientHeight || 160));
      if (canvas.width !== cssW) canvas.width = cssW;
      if (canvas.height !== cssH) canvas.height = cssH;
      const ctx = softwareCtx(canvas);
      const w = cssW;
      const h = cssH;
      ctx.fillStyle = '#11141c';
      ctx.fillRect(0, 0, w, h);
      const runningSchedule = currentJob && jobSchedule;
      const steps = runningSchedule
        ? jobSchedule.requested
        : (Number(document.getElementById('stepsNum').value) || 20);
      const kind = activeScheduleKind();
      const sigmas = previewSigmas(kind, steps);
      const maxS = Math.max(...sigmas, 1e-6);
      const left = 8;
      const right = w - 8;
      const top = 8;
      const bottom = h - 8;
      const n = Math.max(1, sigmas.length);
      const barW = (right - left) / n;
      const strength = Number(document.getElementById('i2iStrengthNum').value);
      const skipped = runningSchedule
        ? jobSchedule.skipped
        : (isI2i() ? skippedDenoiseSteps(n, strength) : 0);
      const samplerStep = Number(liveSamplerStep);
      const highlight = runningSchedule && samplerStep > 0 ? skipped + samplerStep - 1 : -1;
      sigmas.forEach((s, i) => {
        const bh = (s / maxS) * (bottom - top);
        const x = left + i * barW;
        const y = bottom - bh;
        const dropped = i < skipped;
        const active = i === highlight;
        ctx.fillStyle = dropped
          ? (i % 2 ? 'rgba(248,113,113,0.72)' : 'rgba(239,68,68,0.95)')
          : active
            ? 'rgba(251, 191, 36, 0.95)'
            : (i % 2 ? 'rgba(129,140,248,0.55)' : 'rgba(99,102,241,0.85)');
        ctx.beginPath();
        ctx.rect(x + 0.5, y, Math.max(1, barW - 1), bh);
        ctx.fill();
        ctx.strokeStyle = dropped ? '#fecaca' : (active ? '#fef3c7' : '#c7d2fe');
        ctx.lineWidth = active ? 2 : 1;
        ctx.stroke();
      });
    }

    let i2iSource = null;
    let i2iSourceUrl = null;
    let refPage = 0;
    let refSources = [null, null, null];
    let refSourceUrls = [null, null, null];
    let ref3On = false;
    let ref4On = false;

    function isI2i() {
      return document.getElementById('genMode').value === 'i2i';
    }

    function i2iImageLoaded() {
      return !!i2iSource || (isQwenImage21() && qwenI2iReady());
    }

    function i2iDim() {
      const picked = document.querySelector('input[name="i2iDim"]:checked');
      return picked ? picked.value : 'source';
    }

    function round64(n) {
      return Math.max(64, Math.round(n / 64) * 64);
    }

    function reflectCoord(v, size) {
      if (size <= 1) return 0;
      let x = v;
      while (x < 0 || x >= size) {
        if (x < 0) x = -x - 1;
        else x = size * 2 - x - 1;
      }
      return x;
    }

    function paintI2i(ctx, img, w, h, mode) {
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;
      if (mode === 'stretch' || mode === 'source') {
        ctx.drawImage(img, 0, 0, w, h);
        return;
      }
      if (mode === 'fill') {
        const scale = Math.max(w / iw, h / ih);
        const dw = iw * scale;
        const dh = ih * scale;
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
        return;
      }
      const scale = Math.min(w / iw, h / ih);
      const dw = Math.max(1, Math.round(iw * scale));
      const dh = Math.max(1, Math.round(ih * scale));
      const ox = Math.floor((w - dw) / 2);
      const oy = Math.floor((h - dh) / 2);
      if (mode !== 'fit-tile') {
        ctx.fillStyle = mode === 'fit-white' ? '#ffffff' : mode === 'fit-black' ? '#000000' : 'rgb(128,128,128)';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, ox, oy, dw, dh);
        return;
      }
      const fitted = document.createElement('canvas');
      fitted.width = dw;
      fitted.height = dh;
      const fittedCtx = softwareCtx(fitted);
      fittedCtx.drawImage(img, 0, 0, dw, dh);
      const src = fittedCtx.getImageData(0, 0, dw, dh).data;
      const out = ctx.createImageData(w, h);
      for (let y = 0; y < h; y++) {
        const sy = reflectCoord(y - oy, dh);
        for (let x = 0; x < w; x++) {
          const sx = reflectCoord(x - ox, dw);
          const si = (sy * dw + sx) * 4;
          const di = (y * w + x) * 4;
          out.data[di] = src[si];
          out.data[di + 1] = src[si + 1];
          out.data[di + 2] = src[si + 2];
          out.data[di + 3] = 255;
        }
      }
      ctx.putImageData(out, 0, 0);
    }

    function composeI2iCanvas() {
      const img = i2iSource;
      if (!img || !img.naturalWidth) {
        updateI2iPreview();
        return null;
      }
      const mode = i2iDim();
      let w = Number(document.getElementById('width').value) || 512;
      let h = Number(document.getElementById('height').value) || 512;
      if (mode === 'source') {
        w = round64(img.naturalWidth);
        h = round64(img.naturalHeight);
        document.getElementById('width').value = String(w);
        document.getElementById('height').value = String(h);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      paintI2i(softwareCtx(canvas), img, w, h, mode);
      updateI2iPreview();
      return canvas;
    }

    function i2iOutputSize() {
      const mode = i2iDim();
      if (mode === 'source' && i2iSource && i2iSource.naturalWidth) {
        return {
          w: Math.max(1, i2iSource.naturalWidth),
          h: Math.max(1, i2iSource.naturalHeight),
        };
      }
      return {
        w: Math.max(1, Number(document.getElementById('width').value) || 512),
        h: Math.max(1, Number(document.getElementById('height').value) || 512),
      };
    }

    function i2iPreviewBox(w, h) {
      const panel = document.getElementById('i2iPanel');
      const style = panel ? getComputedStyle(panel) : null;
      const pad = style
        ? (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.paddingRight) || 0)
        : 0;
      const inner = panel && panel.clientWidth > pad + 64
        ? panel.clientWidth - pad
        : 360;
      const maxW = Math.max(160, Math.floor(inner));
      const scale = Math.min(maxW / w, maxW / h);
      const cssW = Math.max(1, Math.round(w * scale));
      const cssH = Math.max(1, Math.round(h * scale));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      return {
        cssW,
        cssH,
        bufW: Math.max(1, Math.round(cssW * dpr)),
        bufH: Math.max(1, Math.round(cssH * dpr)),
      };
    }

    function updateI2iPreview() {
      if (!isI2i()) return;
      const canvas = document.getElementById('i2iPreview');
      if (!canvas) return;
      const refImage = isQwenImage21() && refPage > 0 ? refSources[refPage - 1] : null;
      const showingRef = isQwenImage21() && refPage > 0;
      const size = showingRef
        ? {
          w: refImage && refImage.naturalWidth ? refImage.naturalWidth : 320,
          h: refImage && refImage.naturalHeight ? refImage.naturalHeight : 180,
        }
        : i2iOutputSize();
      const box = i2iPreviewBox(size.w, size.h);
      canvas.style.width = box.cssW + 'px';
      canvas.style.height = box.cssH + 'px';
      if (canvas.width !== box.bufW) canvas.width = box.bufW;
      if (canvas.height !== box.bufH) canvas.height = box.bufH;
      const ctx = softwareCtx(canvas);
      const img = showingRef ? refImage : i2iSource;
      if (!img || !img.naturalWidth) {
        ctx.fillStyle = '#11141c';
        ctx.fillRect(0, 0, box.bufW, box.bufH);
        return;
      }
      const mode = showingRef ? 'stretch' : i2iDim();
      paintI2i(ctx, img, box.bufW, box.bufH, mode === 'source' ? 'stretch' : mode);
    }

    function currentSlot() {
      return isQwenImage21() ? refPage : 0;
    }

    function setSlotImage(img, url) {
      const slot = currentSlot();
      if (slot === 0) {
        rememberI2iSource(img, url);
        return;
      }
      const index = slot - 1;
      if (refSourceUrls[index] && refSourceUrls[index] !== url) URL.revokeObjectURL(refSourceUrls[index]);
      refSourceUrls[index] = url || null;
      refSources[index] = img;
      syncI2i();
      updateI2iPreview();
    }

    function qwenRefsToSend() {
      const images = [];
      if (refSources[0]) images.push(refSources[0]);
      if (ref3On && refSources[1]) images.push(refSources[1]);
      if (ref4On && refSources[2]) images.push(refSources[2]);

    function qwenI2iReady() {

    function syncRefChrome() {
      const qwenModel = isQwenImage21();
      const qwen = qwenModel && isI2i();
      const pager = document.getElementById('refPager');
      if (!qwenModel) refPage = 0;

    function stepRefPage(dir) {
      if (!isQwenImage21()) return;
      refPage = (refPage + dir + 4) % 4;

    function setI2iSource(img) {
      i2iSource = img;
      syncI2i();
      updateI2iPreview();
      persistSession();
    }

    function rememberI2iSource(img, url) {
      if (i2iSourceUrl && i2iSourceUrl !== url) URL.revokeObjectURL(i2iSourceUrl);
      i2iSourceUrl = url || null;
      setI2iSource(img);
    }

    function readPngParameters(buffer) {
      const bytes = new Uint8Array(buffer);
      const sig = [137, 80, 78, 71, 13, 10, 26, 10];
      if (bytes.length < 8 || sig.some((b, i) => bytes[i] !== b)) return null;
      const view = new DataView(buffer);
      const decoder = new TextDecoder('utf-8');
      let offset = 8;
      while (offset + 12 <= bytes.length) {
        const length = view.getUint32(offset);
        const type = decoder.decode(bytes.subarray(offset + 4, offset + 8));
        const dataStart = offset + 8;
        const dataEnd = dataStart + length;
        if (dataEnd + 4 > bytes.length) return null;
        if (type === 'tEXt') {
          const data = bytes.subarray(dataStart, dataEnd);
          let nul = -1;
          for (let i = 0; i < data.length; i++) {
            if (data[i] === 0) { nul = i; break; }
          }
          if (nul > 0 && decoder.decode(data.subarray(0, nul)) === 'parameters') {
            return decoder.decode(data.subarray(nul + 1));
          }
        }
        if (type === 'IEND') break;
        offset = dataEnd + 4;
      }
      return null;
    }

    function sectionAfter(text, label, followers) {
      const key = '\n' + label;
      const at = text.indexOf(key);
      if (at < 0) return null;
      const start = at + key.length;
      let end = text.length;
      followers.forEach(follow => {
        const next = text.indexOf('\n' + follow, start);
        if (next !== -1 && next < end) end = next;
      });
      return text.slice(start, end);
    }

    function parseParametersText(text) {
      const marker = ', SDCPP: ';
      const at = text.lastIndexOf(marker);
      if (at >= 0) {
        try {
          const data = JSON.parse(text.slice(at + marker.length).trim());
          if (data && data.prompt && typeof data.prompt.positive === 'string') {
            const prompt = data.prompt;
            return {
              positive: prompt.positive,
              negative: Object.prototype.hasOwnProperty.call(prompt, 'negative') ? prompt.negative : null,
              nag: Object.prototype.hasOwnProperty.call(prompt, 'nag') ? prompt.nag : null,
            };
          }
        } catch (err) { /* fall through to the text block */ }
      }
      const cuts = ['\nNegative prompt: ', '\nNAG prompt: ', '\nSteps: ']
        .map(mark => text.indexOf(mark))
        .filter(index => index >= 0);
      const cut = cuts.length ? Math.min.apply(null, cuts) : text.length;
      return {
        positive: text.slice(0, cut),
        negative: sectionAfter(text, 'Negative prompt: ', ['NAG prompt: ', 'Steps: ']),
        nag: sectionAfter(text, 'NAG prompt: ', ['Steps: ', 'Negative prompt: ']),
      };
    }

    function applyParsedPrompts(parsed, replaceEmpty) {
      document.getElementById('prompt').value = parsed.positive;
      if (typeof parsed.negative === 'string' && (replaceEmpty || parsed.negative.trim() !== '')) {
        document.getElementById('negPrompt').value = parsed.negative;
      }
      if (typeof parsed.nag === 'string' && (replaceEmpty || parsed.nag.trim() !== '')) {
        document.getElementById('nagPrompt').value = parsed.nag;
      }
    }

    function applyPngPromptBytes(buffer, label) {
      let text = null;
      try {
        text = readPngParameters(buffer);
      } catch (err) {
        text = null;
      }
      const parsed = text == null || text.trim() === '' ? null : parseParametersText(text);
      if (!parsed || typeof parsed.positive !== 'string') {
        setStatusText('No prompt metadata in that PNG', false);
        return false;
      }
      applyParsedPrompts(parsed, false);
      persistSession();
      setStatusText('Loaded prompt from ' + label, false);
      return true;
    }

    function fieldAfter(text, label) {
      const at = text.indexOf(label);
      if (at < 0) return null;
      const start = at + label.length;
      const comma = text.indexOf(',', start);
      const raw = (comma < 0 ? text.slice(start) : text.slice(start, comma)).trim();
      return raw || null;
    }

    function parseExtraArgs(text) {
      const out = {};
      String(text || '').split(',').forEach(part => {
        const eq = part.indexOf('=');
        if (eq <= 0) return;
        const key = part.slice(0, eq).trim();
        if (!key) return;
        out[key] = part.slice(eq + 1).trim();
      });
      return out;
    }

    function selectHasValue(id, value) {
      const el = document.getElementById(id);
      if (!el || value == null || value === '') return false;
      return Array.from(el.options).some(opt => opt.value === String(value));
    }

    function setNumericFields(ids, value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return false;
      const text = String(n);
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = text;
      });
      return true;
    }

    function parseSdcppRecord(text) {
      const marker = ', SDCPP: ';
      const at = text.lastIndexOf(marker);
      if (at < 0) return null;
      try {
        const data = JSON.parse(text.slice(at + marker.length).trim());
        return data && typeof data === 'object' ? data : null;
      } catch (err) {
        return null;
      }
    }

    function applyNagArgs(extra) {
      setNumericFields(['nagScale'], extra.nag_scale);
      setNumericFields(['nagTau'], extra.nag_tau);
      setNumericFields(['nagAlpha'], extra.nag_alpha);
      setNumericFields(['nagSigmaEnd'], extra.nag_sigma_end);
    }

    function applyGenerationRecord(record) {
      const sampling = record.sampling && typeof record.sampling === 'object' ? record.sampling : {};
      const guidance = sampling.guidance && typeof sampling.guidance === 'object' ? sampling.guidance : {};
      setNumericFields(['steps', 'stepsNum'], sampling.steps);
      setNumericFields(['cfg', 'cfgNum'], guidance.txt_cfg);
      setNumericFields(['seed'], record.seed);
      setNumericFields(['width'], record.width);
      setNumericFields(['height'], record.height);
      if (record.clip_skip != null && Number(record.clip_skip) > 0) {
        setNumericFields(['clipSkip'], record.clip_skip);
      }
      if (selectHasValue('sampler', sampling.method)) {
        document.getElementById('sampler').value = sampling.method;
      }
      const extra = parseExtraArgs(sampling.extra_sample_args);
      applyNagArgs(extra);
      const hasScheduler = Object.prototype.hasOwnProperty.call(sampling, 'scheduler');
      const schedulerName = typeof sampling.scheduler === 'string' ? sampling.scheduler : '';
      const designerFields = DESIGNER_FIELDS[schedulerName] || [];
      const hasDesigner = designerFields.some(field => Object.prototype.hasOwnProperty.call(extra, field.key));
      if (hasDesigner) {
        document.getElementById('scheduler').value = DESIGNER_SENTINEL;
        if (selectHasValue('designerFormula', schedulerName)) {
          document.getElementById('designerFormula').value = schedulerName;
        }
        designerFields.forEach(field => {
          if (!Object.prototype.hasOwnProperty.call(extra, field.key)) return;
          savedDesigner[schedulerName + '.' + field.key] = field.type === 'bool'
            ? extra[field.key] === 'true'
            : extra[field.key];
        });
      } else if (hasScheduler && selectHasValue('scheduler', schedulerName)) {
        document.getElementById('scheduler').value = schedulerName;
      } else if (!hasScheduler) {
        document.getElementById('scheduler').value = '';
      }
      if (record.hires && typeof record.hires === 'object') {
        document.getElementById('enableHr').checked = !!record.hires.enabled;
        setNumericFields(['hrScale'], record.hires.scale);
        setNumericFields(['hrSteps'], record.hires.steps);
        setNumericFields(['hrDenoise', 'hrDenoiseNum'], record.hires.denoising_strength);
      } else {
        document.getElementById('enableHr').checked = false;
      }
      if (record.video && record.video.frame_count != null) {
        setNumericFields(['videoFrames'], record.video.frame_count);
      }
      const strength = Number(record.strength);
      if (!Number.isFinite(strength)) return false;
      setNumericFields(['i2iStrength', 'i2iStrengthNum'], strength);
      return strength < 0.999;
    }

    function applyTextGenerationLine(text) {
      setNumericFields(['steps', 'stepsNum'], fieldAfter(text, 'Steps: '));
      setNumericFields(['cfg', 'cfgNum'], fieldAfter(text, 'CFG scale: '));
      setNumericFields(['seed'], fieldAfter(text, 'Seed: '));
      const size = fieldAfter(text, 'Size: ');
      if (size && size.includes('x')) {
        const parts = size.split('x');
        setNumericFields(['width'], parts[0]);
        setNumericFields(['height'], parts[1]);
      }
      const samplerField = fieldAfter(text, 'Sampler: ');
      if (samplerField) {
        const parts = samplerField.split(/\s+/);
        if (selectHasValue('sampler', parts[0])) document.getElementById('sampler').value = parts[0];
        if (parts[1] && selectHasValue('scheduler', parts[1])) {
          document.getElementById('scheduler').value = parts[1];
        }
      }
      const clip = fieldAfter(text, 'Clip skip: ');
      if (clip) setNumericFields(['clipSkip'], clip);
      const extra = fieldAfter(text, 'Extra sample args: ');
      if (extra) applyNagArgs(parseExtraArgs(extra));
    }

    function readPngSourceImages(buffer) {
      const bytes = new Uint8Array(buffer);
      const sig = [137, 80, 78, 71, 13, 10, 26, 10];
      if (bytes.length < 8 || sig.some((b, i) => bytes[i] !== b)) return [];
      const view = new DataView(buffer);
      let offset = 8;
      let chunk = null;
      while (offset + 12 <= bytes.length) {
        const length = view.getUint32(offset);
        const type = String.fromCharCode(
          bytes[offset + 4], bytes[offset + 5], bytes[offset + 6], bytes[offset + 7]
        );
        const dataStart = offset + 8;
        const dataEnd = dataStart + length;
        if (dataEnd + 4 > bytes.length) return [];
        if (type === 'sdIs') chunk = bytes.slice(dataStart, dataEnd);
        if (type === 'IEND') break;
        offset = dataEnd + 4;
      }
      if (!chunk || chunk.length < 3 || chunk[0] !== 1) return [];
      const chunkView = new DataView(chunk.buffer, chunk.byteOffset, chunk.byteLength);
      const count = chunkView.getUint16(1);
      const images = [];
      let cursor = 3;
      for (let i = 0; i < count; i++) {
        if (cursor + 6 > chunk.length) break;
        const role = chunk[cursor];
        const index = chunk[cursor + 1];
        const length = chunkView.getUint32(cursor + 2);
        cursor += 6;
        if (length > chunk.length - cursor) break;
        const png = chunk.slice(cursor, cursor + length);
        cursor += length;
        if (png.length >= 8 && png[0] === 137) images.push({ role, index, png });
      }
      return images;
    }

    function loadRecoveredPng(slot, pngBytes) {
      const blob = new Blob([pngBytes], { type: 'image/png' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        if (slot === 0) {
          rememberI2iSource(img, url);
          return;
        }
        const index = slot - 1;
        if (index < 0 || index >= refSources.length) {
          URL.revokeObjectURL(url);
          return;
        }
        if (refSourceUrls[index] && refSourceUrls[index] !== url) URL.revokeObjectURL(refSourceUrls[index]);
        refSourceUrls[index] = url;
        refSources[index] = img;
        if (index === 1) ref3On = true;
        if (index === 2) ref4On = true;
        syncI2i();
        updateI2iPreview();
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    }

    function recoverSourceImages(images) {
      const init = images.find(image => image.role === 1);
      const refs = images.filter(image => image.role === 2).sort((a, b) => a.index - b.index);
      let placed = 0;
      if (init) {
        document.getElementById('genMode').value = 'i2i';
        if (isQwenImage21()) document.getElementById('qwenUseInit').checked = true;
        loadRecoveredPng(0, init.png);
        placed++;
      }
      if (isQwenImage21()) {
        if (!init && refs.length) document.getElementById('qwenUseInit').checked = false;
        refs.forEach((image, index) => {
          if (index > 2) return;
          document.getElementById('genMode').value = 'i2i';
          loadRecoveredPng(index + 1, image.png);
          placed++;
        });
      } else if (!init && refs.length) {
        document.getElementById('genMode').value = 'i2i';
        loadRecoveredPng(0, refs[0].png);
        placed++;
      }
      return placed;
    }

    function applyPngAllBytes(buffer, label) {
      let text = null;
      try {
        text = readPngParameters(buffer);
      } catch (err) {
        text = null;
      }
      const parsed = text == null || text.trim() === '' ? null : parseParametersText(text);
      const record = text ? parseSdcppRecord(text) : null;
      const sources = readPngSourceImages(buffer);
      if ((!parsed || typeof parsed.positive !== 'string') && !record && !sources.length) {
        setStatusText('No generation metadata in that PNG', false);
        return false;
      }
      if (parsed && typeof parsed.positive === 'string') applyParsedPrompts(parsed, true);
      const nagInJson = !!(record && record.prompt && typeof record.prompt.nag === 'string' && record.prompt.nag.trim() !== '');
      if (recordIsFlux(record) && !nagInJson) {
        document.getElementById('nagPrompt').value = '';
      }
      const missingInit = record ? applyGenerationRecord(record) : false;
      if (!record && text) applyTextGenerationLine(text);
      const recovered = recoverSourceImages(sources);
      syncDesigner();
      syncSizeReadout();
      syncSizeSelection();
      drawScheduleChart();
      syncI2i();
      let note = '';
      if (recovered) note = ' (' + recovered + ' source image' + (recovered === 1 ? '' : 's') + ')';
      else if (missingInit) note = ' (init image is not in the file)';
      setStatusText('Loaded settings from ' + label + note, false);
      return true;
    }

    function canvasToPngDataUrl(canvas) {
      return new Promise((resolve, reject) => {
        let blob = null;
        try {
          canvas.toBlob(out => {
            blob = out;
            if (!blob) {
              reject(new Error('canvas is unreadable'));
              return;
            }
            const reader = new FileReader();
            reader.onload = () => resolve(String(reader.result));
            reader.onerror = () => reject(reader.error || new Error('read failed'));
            reader.readAsDataURL(blob);
          }, 'image/png');
        } catch (err) {
          reject(err);
        }
      });
    }
